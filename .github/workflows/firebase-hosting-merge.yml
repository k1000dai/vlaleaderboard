# Refactored to call the reusable deployment workflow (firebase-deploy.yml)
# so that scheduled data updates can reuse the same deployment.

name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main
jobs:
  build_and_deploy:
    # Scheduled RoboLab updates deploy explicitly in update-robolab.yml.
    # Keep this guard in case a GITHUB_TOKEN push also emits a push event.
    if: github.actor != 'github-actions[bot]' || !contains(github.event.head_commit.message, 'update RoboLab leaderboard data')
    uses: ./.github/workflows/firebase-deploy.yml
    secrets: inherit
